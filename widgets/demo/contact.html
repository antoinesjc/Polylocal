<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polylocal Contact widget demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
  body { margin: 0; }
  .fake-odoo-header { background: #6C757D; color: #fff; padding: 18px 24px; display: flex; gap: 12px; align-items: center; font-weight: 600; }
  .fake-odoo-header button { font: inherit; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div class="fake-odoo-header">
  Odoo header (demo) ·
  <button type="button" onclick="document.documentElement.lang='en'">English</button>
  <button type="button" onclick="document.documentElement.lang='zh-TW'">繁體中文</button>
</div>
<main><div id="wrap">
<section class="s_embed_code"><div class="container">
  <!-- This is exactly what goes in the Odoo Embed Code block -->
  <polylocal-contact></polylocal-contact>
</div></section>
<!-- Below: a copy of Odoo's own "Title - Form" block, as on /contactus -->
<section class="s_title_form o_cc o_cc2 pt64 pb48"><div class="o_container_small">
  <h2>Let's Connect</h2><p>Get in touch with your customers to provide them with better service.</p>
  <section class="s_website_form pt16 pb16"><div class="container-fluid">
    <form action="#" method="post" class="o_mark_required" data-model_name="crm.lead" onsubmit="event.preventDefault(); alert('Odoo would send this to the CRM');">
      <div class="s_website_form_rows row s_col_no_bgcolor"><div class="s_website_form_field mb-3 col-12 s_website_form_required"><div class="row s_col_no_resize s_col_no_bgcolor"><label class="col-form-label col-sm-auto s_website_form_label" style="width: 200px"><span class="s_website_form_label_content">Your Name</span><span class="s_website_form_mark"> *</span></label><div class="col-sm"><input class="form-control s_website_form_input" type="text" name="contact_name"></div></div></div><div class="s_website_form_field mb-3 col-12"><div class="row s_col_no_resize s_col_no_bgcolor"><label class="col-form-label col-sm-auto s_website_form_label" style="width: 200px"><span class="s_website_form_label_content">Phone Number</span></label><div class="col-sm"><input class="form-control s_website_form_input" type="text" name="phone"></div></div></div><div class="s_website_form_field mb-3 col-12 s_website_form_required"><div class="row s_col_no_resize s_col_no_bgcolor"><label class="col-form-label col-sm-auto s_website_form_label" style="width: 200px"><span class="s_website_form_label_content">Your Email</span><span class="s_website_form_mark"> *</span></label><div class="col-sm"><input class="form-control s_website_form_input" type="text" name="email_from"></div></div></div><div class="s_website_form_field mb-3 col-12"><div class="row s_col_no_resize s_col_no_bgcolor"><label class="col-form-label col-sm-auto s_website_form_label" style="width: 200px"><span class="s_website_form_label_content">Your Company</span></label><div class="col-sm"><input class="form-control s_website_form_input" type="text" name="partner_name"></div></div></div><div class="s_website_form_field mb-3 col-12 s_website_form_required"><div class="row s_col_no_resize s_col_no_bgcolor"><label class="col-form-label col-sm-auto s_website_form_label" style="width: 200px"><span class="s_website_form_label_content">Subject</span><span class="s_website_form_mark"> *</span></label><div class="col-sm"><input class="form-control s_website_form_input" type="text" name="name"></div></div></div><div class="s_website_form_field mb-3 col-12 s_website_form_required"><div class="row s_col_no_resize s_col_no_bgcolor"><label class="col-form-label col-sm-auto s_website_form_label" style="width: 200px"><span class="s_website_form_label_content">Your Question</span><span class="s_website_form_mark"> *</span></label><div class="col-sm"><textarea class="form-control s_website_form_input" name="description" rows="4"></textarea></div></div></div><div class="s_website_form_field mb-3 col-12 s_website_form_dnone"><div class="row s_col_no_resize s_col_no_bgcolor"><label class="col-form-label col-sm-auto s_website_form_label" style="width: 200px"><span class="s_website_form_label_content"></span></label><div class="col-sm"><input class="form-control s_website_form_input" type="text" name="team_id"></div></div></div><div class="s_website_form_field mb-3 col-12 s_website_form_dnone"><div class="row s_col_no_resize s_col_no_bgcolor"><label class="col-form-label col-sm-auto s_website_form_label" style="width: 200px"><span class="s_website_form_label_content"></span></label><div class="col-sm"><input class="form-control s_website_form_input" type="text" name="user_id"></div></div></div>
        <div class="mb-0 py-2 col-12 s_website_form_submit text-end s_website_form_no_submit_label"><div class="s_website_form_label" style="width: 200px"></div><a href="#" role="button" class="btn btn-primary s_website_form_send">Submit</a><span id="s_website_form_result"></span></div>
      </div>
    </form>
  </div></section>
</div></section>
</div></main>
<script src="../dist/polylocal-contact.js"></script>
</body>
</html>
