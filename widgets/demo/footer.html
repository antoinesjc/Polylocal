<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polylocal Footer widget demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>body{margin:0}.fake{padding:40px 24px;background:#F6F3EF}.fake button{margin-right:8px}</style>
</head>
<body>
<div id="wrapwrap">
<div class="fake"><button type="button" onclick="document.documentElement.lang='en'">English</button><button type="button" onclick="document.documentElement.lang='zh-TW'">繁體中文</button> Page content above the footer (demo)</div>
<footer class="o_footer"><div id="footer" class="oe_structure oe_structure_solo">
  <section class="s_embed_code"><div class="container">
    <!-- This is exactly what goes in the Odoo Embed Code block in the footer -->
    <polylocal-footer></polylocal-footer>
  </div></section>
  <!-- Below: a copy of the existing Odoo footer block with the native newsletter form -->
  <section class="s_text_block pb40 pt0"><div class="container"><div class="row">
    <div class="col-lg-4"><p>contact@polylocal.eu</p></div>
    <div class="col-lg-5"><div class="s_newsletter_subscribe_form s_newsletter_list js_subscribe" data-list-id="1" data-name="Newsletter">
      <div class="js_subscribed_wrap d-none"><p class="h4-fs text-center text-success"><i class="fa fa-check-circle-o"></i> Thanks for subscribing!</p></div>
      <div class="js_subscribe_wrap"><div class="input-group"><input type="email" name="email" class="js_subscribe_value form-control s_newsletter_subscribe_form_input" placeholder="Email Address"><a role="button" href="#" class="btn btn-primary js_subscribe_btn o_submit">Subscribe</a></div></div>
    </div></div>
  </div></div></section>
</div>
<div class="o_footer_copyright"><div class="container py-3"><div class="row"><div class="col-sm text-center text-sm-start">Copyright © Polylocal &nbsp; <a href="#">繁體中文 (台灣)</a> | <a href="#">English (US)</a></div><div class="col-sm text-center text-sm-end">Powered by Odoo</div></div></div></div>
</footer>
</div>
<script src="../dist/polylocal-footer.js"></script>
</body>
</html>
